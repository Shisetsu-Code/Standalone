[package]
name = "game-runner"
version = "0.1.0"
edition = "2024"
default-run = "game-runner"

[dependencies]
cookie_store = { version = "0.22", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }

[profile.release]
strip = true
