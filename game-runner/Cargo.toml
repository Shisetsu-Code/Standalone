[package]
name = "game-runner"
version = "0.1.0"
edition = "2024"
default-run = "game-runner"
rust-version = "1.99"
description = "Durable public-demo round collector with provider-scoped concurrency"
publish = false

[dependencies]
aes = "0.8.4"
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = { version = "1", optional = true }
fs2 = "0.4.3"
futures-util = "0.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "cookies", "form"] }
roxmltree = "0.21.2"
rquickjs = { version = "0.14.0", optional = true }
rusqlite = { version = "0.42.0", features = ["bundled"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["formatting"] }
tempfile = { version = "3.27.0", optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "process"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "game-runner"
path = "src/main.rs"

[features]
redtiger-bundled-http = ["dep:flate2", "dep:tempfile"]
spinomenal-bundled-http = ["redtiger-bundled-http"]
rubyplay-native = ["dep:rquickjs", "dep:flate2"]

