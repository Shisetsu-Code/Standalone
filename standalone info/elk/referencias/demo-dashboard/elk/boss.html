<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Pirots 5 · Progreso Boss</title><style>body{font:16px system-ui;background:#101827;color:#e2e8f0;max-width:1150px;margin:32px auto;padding:0 24px}a{color:#7dd3fc}nav{margin:22px 0;line-height:2}.stats{display:flex;gap:16px;flex-wrap:wrap}.card{background:#1e293b;padding:22px;border-radius:12px;flex:1;min-width:230px}strong{display:block;font-size:32px;color:#6ee7b7}table{width:100%;border-collapse:collapse;margin:24px 0}td,th{text-align:left;padding:12px;border-bottom:1px solid #334155}small{color:#94a3b8}.pending{color:#fbbf24}.ok{color:#6ee7b7}input{padding:12px;width:95%;background:#1e293b;color:white;border:1px solid #475569;border-radius:8px}details{margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}</style><body><nav><a href="../providers.html">Proveedores</a> · <a href="batches/1-100/index.html">Informe ELK</a></nav><h1>Pirots 5 · Recorrido Boss</h1><p>Progreso obtenido mediante las respuestas del demo oficial. Cada ronda conserva su saldo, sus pasos internos y el estado de tokens.</p><div id="state"></div><h2>Últimas 50 rondas</h2><table><thead><tr><th>#</th><th>Tipo</th><th>Mundo</th><th>Modo</th><th>Coste EUR</th><th>Premio EUR</th><th>Evidencia</th></tr></thead><tbody id="rows"></tbody></table><script>
const put=(tag,text,parent)=>{const n=document.createElement(tag);n.textContent=text;parent.append(n);return n};
async function refresh(){const p=await(await fetch('boss-progress.json',{cache:'no-store'})).json();const selected=new URLSearchParams(location.search).get('campaign');if(selected)p.campaign=selected;if(!/^[a-f0-9]{32}$/.test(p.campaign))throw Error('Campaña no válida');const s=await(await fetch('boss-campaigns/'+p.campaign+'/status.json',{cache:'no-store'})).json(),state=document.querySelector('#state');state.replaceChildren();put('p','Estado: '+({completed:'Completado',progressing:'En curso',needs_review:'Revisar'}[s.status]||s.status)+' · '+s.rounds.length+' rondas cerradas · '+s.boss_cases.length+' / 6 pruebas Boss',state);put('p','Tokens: '+Object.entries(s.progress).map(([world,mask])=>world+' '+(Number(mask).toString(2).match(/1/g)||[]).length+'/3').join(' · '),state);if(s.rounds.length)put('p','Saldo ficticio actual: '+s.rounds.at(-1).balance_after+' EUR',state);if(s.error)put('p',s.error,state);const rows=document.querySelector('#rows');rows.replaceChildren();for(const r of s.rounds.slice(-50).reverse()){const tr=put('tr','',rows);for(const value of [r.sequence,r.kind,r.control.variant,r.control.mode,r.cost,r.win])put('td',String(value),tr);const a=put('a','JSON',put('td','',tr));a.href='boss-campaigns/'+p.campaign+'/rounds/'+String(r.sequence).padStart(5,'0')+'.json';}}
refresh().catch(e=>document.querySelector('#state').textContent=e.message);setInterval(()=>refresh().catch(()=>{}),5000);
</script></body></html>
