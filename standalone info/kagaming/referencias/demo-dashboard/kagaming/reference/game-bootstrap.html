<script src="res/loading.js"></script>
<script type="text/javascript">
        var queryString = null;
        var base64QueryString = false;
        var IsLandscapeForFish = null;
        var getQueryString = function() {
            if(!queryString) {
                var browserQuery = window.location.search.substring(1);
                var vars = browserQuery.split("&");
                for(var i = 0; i < vars.length; i++) {
                    var pair = vars[i].split("=");
                    if(pair[0] === "b") {
                        queryString = atob(pair[1]);
                        base64QueryString = true;
                        return queryString;
                    }
                }
                queryString = browserQuery;
            }
            return queryString;
        };
        var getQueryVar = function (variable) {
            var query = getQueryString();
            var vars = query.split("&");
            for (var i=0;i<vars.length;i++) {
                var pair = vars[i].split("=");
                if(pair[0] === variable){return pair[1];}
            }
            return 0;
        };
        function KASetup(){
            this._isFishGames = false;
            this._isLandscapeForFish = true;
        };
        KASetup.prototype.isLandScape = function(){
            return this._isLandscapeForFish;
        };
        KASetup.prototype._ensureFishOrientationHelper = function(){
            if(document.getElementById("kaFishOrientationHelper")) {
                return;
            }
            var source = document.createElement('script');
            source.id = "kaFishOrientationHelper";

            document.body.appendChild(source);
        };
        KASetup.prototype.applyRuntimeProfile = function(isFishGame, isLandscapeForFish){
            this._isFishGames = !!isFishGame;
            this._isLandscapeForFish = (isLandscapeForFish !== false);
            IsLandscapeForFish = this._isLandscapeForFish;
            this.cssSetup();
            if(this._isFishGames){
                this.divSetup();
                this._ensureFishOrientationHelper();
            }
        };
        KASetup.prototype.cssSetup = function(){
            var link = document.getElementById("kaBootCss");
            if (!link) {
                link = document.createElement('link');
                link.id = "kaBootCss";
                link.rel = 'stylesheet';
                document.head.appendChild(link);
            }
            link.href = 'res/include/'+((this._isFishGames)? "fish.css":"main.css");
        };
        KASetup.prototype.jsSetup = function(){
            if (document.getElementById("kaMainScript")) {
                return;
            }
            var script = document.createElement('script');
            script.id = "kaMainScript";
            script.src = "game.min.2090.js";
            document.body.appendChild(script);
        };
        KASetup.prototype.divSetup = function(){
            if(!this._isFishGames){
                return;
            }

            var canvas = document.getElementById("gameCanvas");
            if (!canvas) {
                canvas = document.createElement('canvas');
                canvas.id = "gameCanvas";
                document.body.appendChild(canvas);
            }
            canvas.oncontextmenu = "event.preventDefault()";
            canvas.tabIndex = "0";
            canvas.style.outline = "1px solid transparent";
            canvas.style.boxShadow = "none";
            canvas.style.webkitTapHighlightColor = "rgba(0, 0, 0, 0)";

            if (!document.getElementById("turnorientation")) {
                var tl = document.createElement('div');
                tl.id = "turnorientation";
                document.body.appendChild(tl);
            }

            if (!document.getElementById("turnorientationportrait")) {
                var tp = document.createElement('div');
                tp.id = "turnorientationportrait";
                document.body.appendChild(tp);
            }
        };
        KASetup.prototype.kaGamelaunch=function(){
            this.divSetup();
            this.jsSetup();
        };
        var Generate = new KASetup();
        window.Generate = Generate;
        function isFishGame(){
            return Generate._isFishGames;
        };

        window.onload = function() {
            Generate.kaGamelaunch();
        }
</script>
